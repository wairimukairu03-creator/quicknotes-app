<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <title>Quicknotes app</title>
</head>

<body>
    <header>
        <h1>QuickNotes</h1>
    </header>


    <main>
        <section class="form-section">
            <h2>Create a New Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Content:</label>
                    <input type="text" id="note-input" placeholder="Type your note here...">
                </div>

                <div class="form-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

            
                <div class="form-group button-group">
                <button type="button" id="clear-all-btn" class="danger-btn">Clear All Notes</button>
                <button type="submit" id="submit-btn">Add Note</button>
                </div>
            </form>
            <p id="error-message"></p>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search notes...">
            </div>
            
            <p id="note-count">You have no notes yet.</p>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App.</p>
    </footer>

</body>
</html>
